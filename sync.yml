name: sync-stock

on:
  schedule:
    # ทุกชั่วโมง 07:07–21:07 เวลาไทย (cron ของ GitHub เป็น UTC, ไทย = UTC+7)
    - cron: "7 0-14 * * *"
  workflow_dispatch:        # ปุ่ม Run workflow สำหรับสั่งซิงค์เอง

permissions:
  contents: write

concurrency:
  group: sync-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ดึงชีตและสร้าง data.json
        run: python3 build.py

      - name: commit ถ้ามีการเปลี่ยนแปลง
        run: |
          git config user.name  "stock-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --quiet --cached; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
